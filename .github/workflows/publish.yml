name: Publish Login image

on:
  push:
    branches:
      - main
    paths:
      - "apps/login/**"
      - "packages/**"
      - "proto/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".vern/UPSTREAM_VERSION"
      - ".vern/login.Dockerfile*"
      - ".github/workflows/publish.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    if: github.repository == 'a-man-called-q/vern-zitadel-login'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set image metadata
        id: image
        run: |
          version="$(cat .vern/UPSTREAM_VERSION)"
          image="ghcr.io/a-man-called-q/vern-zitadel-login"
          tag="${version}-${GITHUB_SHA}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # The Login App is built once on the runner's platform; QEMU only runs the
      # runtime stage's user setup for the arm64 image.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Refuse to overwrite an immutable image tag
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          TAG: ${{ steps.image.outputs.tag }}
        run: |
          if docker buildx imagetools inspect "${IMAGE}:${TAG}" >/dev/null 2>&1; then
            echo "Refusing to overwrite ${IMAGE}:${TAG}; each source commit gets one immutable image tag."
            exit 1
          fi

      - name: Build and publish immutable Login image
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .vern/login.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.image }}:${{ steps.image.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/a-man-called-q/vern-zitadel-login
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.image.outputs.version }}
          cache-from: type=gha,scope=vern-zitadel-login
          cache-to: type=gha,mode=max,scope=vern-zitadel-login

      - name: Record image digest
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          TAG: ${{ steps.image.outputs.tag }}
          DIGEST: ${{ steps.publish.outputs.digest }}
          SOURCE_COMMIT: ${{ github.sha }}
          VERSION: ${{ steps.image.outputs.version }}
        run: |
          record="$RUNNER_TEMP/zitadel-login-image.txt"
          cat > "$record" <<EOF
          image=${IMAGE}
          tag=${TAG}
          digest=${DIGEST}
          source_commit=${SOURCE_COMMIT}
          upstream_version=${VERSION}
          EOF
          {
            cat "$record"
            echo
            echo "Vern apps/auth-server/.env.example:"
            echo
            echo '```'
            echo "ZITADEL_VERSION=${VERSION}"
            echo "ZITADEL_LOGIN_IMAGE=${IMAGE}:${TAG}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep digest record with the workflow run
        uses: actions/upload-artifact@v4
        with:
          name: zitadel-login-image-${{ github.sha }}
          path: ${{ runner.temp }}/zitadel-login-image.txt
          if-no-files-found: error
          retention-days: 365
