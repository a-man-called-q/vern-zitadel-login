name: Login App checks

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  NX_NO_CLOUD: "true"
  NX_DAEMON: "false"

jobs:
  verify-login-app:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile --filter @zitadel/login...

      - name: Lint proto definitions
        run: pnpm exec buf lint proto

      - name: Regenerate TypeScript proto package
        run: pnpm exec nx run @zitadel/proto:generate

      - name: Confirm TypeScript proto output is current
        run: git diff --exit-code HEAD -- packages/zitadel-proto

      - name: Build the Login App workspace packages
        env:
          NEXT_PUBLIC_BASE_PATH: /ui/v2/login
        run: pnpm exec nx run @zitadel/login:build

      - name: Lint the Login App
        run: pnpm exec nx run @zitadel/login:lint

      - name: Test the Login App and client package
        run: |
          pnpm exec nx run @zitadel/login:test-unit
          pnpm exec nx run @zitadel/client:test-unit

      - name: Verify generated workspace files and patch formatting
        run: git diff --check

  # Builds the image the publish workflow ships and checks the sign-in shell in
  # a browser against a local ZITADEL stack.
  acceptance:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Run the Vern Login acceptance checks
        run: dev/test-login.sh
