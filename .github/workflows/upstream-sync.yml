name: ZITADEL upstream sync

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
    inputs:
      version:
        description: "ZITADEL release tag to sync (default: the latest stable release)"
        required: false

# GITHUB_TOKEN is enough: pull requests it opens do not start workflows, so the
# last step dispatches the checks on the sync branch itself. The repository must
# allow GitHub Actions to create pull requests (Settings > Actions > General).
permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  open-upstream-update:
    if: github.repository == 'a-man-called-q/vern-zitadel-login'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out fork history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Find the ZITADEL release to sync
        id: release
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          version="${REQUESTED:-$(curl --fail --silent --show-error https://api.github.com/repos/zitadel/zitadel/releases/latest | jq -r .tag_name)}"
          if [ -z "$version" ] || [ "$version" = "null" ]; then
            echo "Could not resolve the latest stable ZITADEL release."
            exit 1
          fi
          current="$(cat .vern/UPSTREAM_VERSION)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          if [ "$version" = "$current" ]; then
            echo "needs_update=false" >> "$GITHUB_OUTPUT"
          else
            echo "needs_update=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip if this release already has an open PR
        id: duplicate
        if: steps.release.outputs.needs_update == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          title="chore: sync ZITADEL ${VERSION}"
          if gh pr list --base main --state open --json title --jq '.[].title' | grep -Fxq "$title"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # scripts/filter-upstream.sh must map upstream commits to the same slim
      # commits every time; a different git-filter-repo version could change them.
      - name: Install git-filter-repo
        if: steps.release.outputs.needs_update == 'true' && steps.duplicate.outputs.skip != 'true'
        run: pipx install git-filter-repo==2.47.0

      - name: Confirm the filter still reproduces the current base
        if: steps.release.outputs.needs_update == 'true' && steps.duplicate.outputs.skip != 'true'
        env:
          CURRENT: ${{ steps.release.outputs.current }}
        run: |
          before="$(git rev-parse "refs/tags/upstream/${CURRENT}")"
          scripts/filter-upstream.sh "$CURRENT"
          after="$(git rev-parse "refs/tags/upstream/${CURRENT}")"
          if [ "$before" != "$after" ]; then
            echo "Re-importing ${CURRENT} produced ${after} instead of ${before}."
            echo "The filter or git-filter-repo version changed; fix that before merging a new release."
            exit 1
          fi

      - name: Merge the filtered release
        id: merge
        if: steps.release.outputs.needs_update == 'true' && steps.duplicate.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
          RUN_ID: ${{ github.run_id }}
        run: |
          scripts/filter-upstream.sh "$VERSION"
          branch="sync/zitadel-${VERSION}-${RUN_ID}"
          git switch --create "$branch"
          if git merge-base --is-ancestor "refs/tags/upstream/${VERSION}" HEAD; then
            echo "The Login sources of ${VERSION} are already part of main; only the version changes."
          elif ! git merge --no-ff --no-edit -m "chore: merge ZITADEL ${VERSION}" "refs/tags/upstream/${VERSION}"; then
            git merge --abort
            echo "Merging ${VERSION} conflicts with the Vern changes. Resolve it locally:"
            echo "  scripts/filter-upstream.sh ${VERSION} && git merge --no-ff upstream/${VERSION}"
            exit 1
          fi
          printf '%s\n' "$VERSION" > .vern/UPSTREAM_VERSION
          git add .vern/UPSTREAM_VERSION
          git commit -m "chore: record ZITADEL ${VERSION} baseline"
          git push origin "refs/tags/upstream/${VERSION}" "$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Open review PR and run its checks
        if: steps.merge.outputs.branch != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          BRANCH: ${{ steps.merge.outputs.branch }}
        run: |
          body_file="$RUNNER_TEMP/zitadel-upstream-pr.md"
          cat > "$body_file" <<EOF
          ## Upstream update

          This PR merges the stable ZITADEL release [${VERSION}](https://github.com/zitadel/zitadel/releases/tag/${VERSION}), filtered to the Login App sources as \`upstream/${VERSION}\`, without squashing history.

          The backend and Login App must run the same release. After merging, the publish workflow builds a new image; update \`ZITADEL_VERSION\` and \`ZITADEL_LOGIN_IMAGE\` in Vern's \`apps/auth-server/.env.example\` together, and validate the image in staging before changing any deployment.

          The sync workflow already ran the checks on this branch; their results are on the commit. GitHub also holds a \`pull_request\` run for approval because a workflow opened this PR; approving it runs the same checks again.
          EOF
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore: sync ZITADEL ${VERSION}" \
            --body-file "$body_file"
          gh workflow run checks.yml --ref "$BRANCH"
