<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1400" viewBox="0 0 1000 1400" preserveAspectRatio="xMidYMid slice" role="presentation" aria-hidden="true">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B1766"/>
      <stop offset="0.55" stop-color="#0E1235"/>
      <stop offset="1" stop-color="#0A0F22"/>
    </linearGradient>
    <radialGradient id="purple" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#5B4CF0" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#5B4CF0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="teal" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#14B8A6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#14B8A6" stop-opacity="0"/>
    </radialGradient>
    <!-- Lights the inside edge of the upper arc. -->
    <radialGradient id="rim" gradientUnits="userSpaceOnUse" cx="-200" cy="-700" r="1380">
      <stop offset="0.72" stop-color="#6D5EF5" stop-opacity="0"/>
      <stop offset="1" stop-color="#6D5EF5" stop-opacity="0.3"/>
    </radialGradient>
    <linearGradient id="arc-upper" gradientUnits="userSpaceOnUse" x1="1000" y1="0" x2="0" y2="665">
      <stop offset="0" stop-color="#A5B4FC" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#8C80FF" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#6D5EF5" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="arc-lower" gradientUnits="userSpaceOnUse" x1="1000" y1="940" x2="350" y2="1400">
      <stop offset="0" stop-color="#5EEAD4" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#5EEAD4" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="1000" height="1400" fill="url(#base)"/>
  <circle cx="60" cy="340" r="720" fill="url(#purple)"/>
  <circle cx="860" cy="920" r="420" fill="url(#teal)"/>

  <!-- Upper arc: the edge of a large circle centred above the top-left corner. -->
  <circle cx="-200" cy="-700" r="1380" fill="url(#rim)"/>
  <path d="M 989 0 A 1380 1380 0 0 1 0 665" fill="none" stroke="url(#arc-upper)" stroke-width="14" filter="url(#glow)" opacity="0.6"/>
  <path d="M 989 0 A 1380 1380 0 0 1 0 665" fill="none" stroke="url(#arc-upper)" stroke-width="2"/>

  <!-- Lower arc, fading out towards the bottom edge. -->
  <path d="M 1000 939 A 1700 1700 0 0 1 347 1400" fill="none" stroke="url(#arc-lower)" stroke-width="12" filter="url(#glow)" opacity="0.5"/>
  <path d="M 1000 939 A 1700 1700 0 0 1 347 1400" fill="none" stroke="url(#arc-lower)" stroke-width="1.5"/>
</svg>
